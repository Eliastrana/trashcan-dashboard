# Everything setup.sh downloads or clones, in one place. Edit here, not in the script.
# (This file is sourced by bash: no spaces around "=".)

# Node.js, installed once for every service into /opt/node. Intel Mac: darwin-x64.
NODE_VERSION=v20.20.2
NODE_ARCH=darwin-x64

# Caddy (the web front door). darwin amd64 build from the official GitHub release.
CADDY_VERSION=2.11.4
CADDY_ARCH=mac_amd64

# The Java used by the Minecraft server (Eclipse Temurin, from Adoptium).
JDK_VERSION="jdk-25.0.4.1+1"
JDK_ARCH=x64

# Hitster. Code comes from GitHub; the Spotify keys come from the backup (hitster.tar.gz).
HITSTER_GIT=https://github.com/Eliastrana/ikke_hitster.git
HITSTER_BRANCH=main

# The arcade (arcade.eliastrana.no). It has no data of its own, so nothing about it is in the backup.
ARENA_GIT=https://github.com/Eliastrana/arcade.git
ARENA_BRANCH=main

# Jeopardy (jeopardy.eliastrana.no): Next.js + websocket server in one process. The OpenAI key (.env) comes from the backup.
JEOPARDY_GIT=https://github.com/Eliastrana/jeopardy.git
JEOPARDY_BRANCH=main

# uv: installs Python and Open WebUI. One root-owned copy in /opt/uv, like Node. Intel Mac: x86_64-apple-darwin.
UV_VERSION=0.13.7
UV_ARCH=x86_64-apple-darwin
PYTHON_VERSION=3.12

# The chat page is Open WebUI (https://github.com/open-webui/open-webui), installed from PyPI at this exact version.
# Python must be >=3.11 and <3.13.
OPENWEBUI_VERSION=0.13.3
OPENWEBUI_MODEL=gemma3:1b

# Ollama models the chat page uses (setup.sh only prints a reminder, Ollama is installed by hand).
OLLAMA_MODELS="gemma3:1b gemma:latest llama3.2:1b"

# Spotify Connect speaker. Built from source on the Mac (cargo install), nothing is downloaded as a binary.
LIBRESPOT_VERSION=0.8.0
LIBRESPOT_NAME=Trashcan

# Guest VMs (ssh logins for friends). One VM per guest: this much each, on consecutive ports from the first.
VBOX_VERSION=7.2.22
VBOX_BUILD=175245
GUEST_IMAGE_URL=https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-amd64.vmdk
GUEST_IMAGE_SHA256=9a1e3959c9f4ad9d4752101fd4ff9a43191fb7d72e61fa20e033f9fd235ce794
GUEST_CPUS=2
GUEST_RAM=4096
GUEST_DISK=20480
GUEST_FIRST_PORT=2201
GUEST_MAX=3
